const u = (k) => (UI[lang] && UI[lang][k]) || UI.zh[k];

async function api(action, extra) {
  if (!/^https:\/\/script\.google\.com\//.test(API_URL)) throw Object.assign(new Error('setup'), { code: 'setup' });
  const body = Object.assign({ liff: 1, action, lang, form: FORM, idToken: liff.getIDToken() }, extra || {});
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  } catch (e) { throw Object.assign(new Error('net'), { code: 'net' }); }
  if (!res.ok) throw Object.assign(new Error('net'), { code: 'net' });
  return res.json();
}
function fail(r) {
  const code = (r && r.code) || 'error';
  if (code === 'auth') return center(u('auth'), { t: u('retry'), f: relogin });
  if (code === 'setup') return center(u('setup'));
  if (code === 'expired') { alert(u('expired')); return renderForm(); }
  if (code === 'net') return alert(u('net'));
  if (code === 'unbound' || code === 'notallowed') return center(r.msg, { t: u('close'), f: closeWin });
  alert((r && r.msg) || u('net'));
}
function relogin() { try { if (!liff.isInClient()) { liff.logout(); liff.login({ redirectUri: location.href }); return; } } catch (e) {} location.reload(); }
function closeWin() { try { if (liff.isInClient()) return liff.closeWindow(); } catch (e) {} window.close(); }

/* ===== 啟動 ===== */
async function boot() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const tk = liff.getDecodedIDToken();
    if (!liff.isInClient() && (!tk || tk.exp * 1000 < Date.now() + 60000)) { liff.logout(); liff.login({ redirectUri: location.href }); return; } // 在一般瀏覽器開：登入過期就重新登入
    FORM = formParam();
    await loadInfo();
  } catch (e) {
    center(u('auth') + '\n\n' + (e && e.message ? e.message : ''), { t: u('retry'), f: () => location.reload() });
  }
}
async function loadInfo(newLang) {
  busy(u('loading'));
  try {
    const r = await api('init', newLang ? { lang: newLang } : {});
    if (!r.ok) return fail(r);
    INFO = r; lang = r.lang; header();
    if (VIEW) renderConfirm(VIEW); else renderForm();
  } catch (e) { fail(e); } finally { busy(''); }
}

  } else {
    if (!f2.ds) e['請假起'] = u('need');
    if (!f2.de) e['請假迄'] = u('need');
    if (!String(f2.reason).trim()) e['事由'] = u('need');
    data = { '請假起': f2.ds, '請假迄': f2.de, '事由': f2.reason.trim(), '備註': (f2.memo || '').trim() || '無' };
  }
  if (Object.keys(e).length) return renderForm2(e);
  if (FORM === 'out') { // 手機號碼：第一次填的自動記住；和記住的不同時，問要不要換成新號碼
    const saved = String(INFO.savedPhone || '').trim(), now = f2.phone.trim();
    f2.savePhone = !saved ? true : saved === now ? false : await askPhone(saved, now);
  }
  busy(u('checking'));
  try {
    const r = await api('check2', { data });
    if (!r.ok) { if (r.code === 'invalid') return renderForm2({ [r.field in data ? r.field : 'form']: r.msg }); return fail(r); }
    renderConfirm(r);
  } catch (err) { fail(err); } finally { busy(''); }
}

FORM = preForm(); header(); // 一打開就顯示正確的表單標題
boot();
</script>
</body>
</html>
